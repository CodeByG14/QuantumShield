[project]
name = "quantumshield"
version = "0.1.0"
description = "Post-quantum cryptography migration framework"
readme = "README.md"
authors = [
    { name = "CodeByG14", email = "nairgirish2004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.115",
    "jsonschema>=4.26.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.14.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "tabulate>=0.10.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
quantumshield = "quantumshield.__main__:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Ship the core package and the prescribed top-level `monitor` CLI namespace.
module-name = ["quantumshield", "monitor", "compliance"]
[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
