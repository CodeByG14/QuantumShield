# QuantumShield Migration Recommendation Registry — Week 6 Track 2
# Versioned, explainable post-quantum migration guidance
#
# This registry maps classical cryptographic algorithms and roles to suitable
# post-quantum alternatives based on NIST standards and maintained implementation
# documentation. Each mapping includes rationale, caveats, and references.
#
# IMPORTANT: These are advisory recommendations, not drop-in replacements.
# All recommendations require compatibility testing, application changes,
# and verification in the target environment.

version: "1.1"
last_updated: "2026-10-25"
policy_note: "Added migration categories, waves, timeline estimates, depends_on, strategy rules, and KB sources"

# Standards references (verification date: 2026-10-18)
standards:
  - name: "NIST FIPS 203"
    title: "Module-Lattice-Based Key-Encapsulation Mechanism Standard"
    url: "https://csrc.nist.gov/pubs/fips/203/final"
    note: "ML-KEM for key establishment. Check errata for latest corrections."

  - name: "NIST FIPS 204"
    title: "Module-Lattice-Based Digital Signature Standard"
    url: "https://csrc.nist.gov/pubs/fips/204/final"
    note: "ML-DSA for digital signatures"

  - name: "NIST FIPS 205"
    title: "Stateless Hash-Based Digital Signature Standard"
    url: "https://csrc.nist.gov/pubs/fips/205/final"
    note: "SLH-DSA for digital signatures"

  - name: "IETF RFC 9954"
    title: "Hybrid Key Exchange in TLS 1.3"
    url: "https://www.rfc-editor.org/rfc/rfc9954.html"
    note: "Hybrid key exchange for TLS 1.3"

# Migration recommendations by cryptographic role and algorithm
recommendations:

  # Key Establishment (RSA key transport, ECDH, DH)
  - id: "REC-001"
    source_algorithms: ["RSA"]
    source_roles: ["key-establishment"]
    target_algorithm: "ML-KEM"
    target_standard: "NIST FIPS 203"
    rationale: "RSA key transport is vulnerable to Shor's algorithm. ML-KEM provides post-quantum key encapsulation."
    compatibility_notes:
      - "NOT a drop-in replacement; requires protocol changes"
      - "Key encapsulation works differently than RSA encryption"
      - "Requires library/framework support for ML-KEM"
      - "Hybrid mode may be available for gradual transition"
    prerequisites:
      - "Verify ML-KEM support in cryptographic library"
      - "Update protocol to use key encapsulation pattern"
      - "Test interoperability with peer systems"
    effort_band: "large"
    confidence: "high"
    verification_steps:
      - "Confirm ML-KEM algorithm negotiation"
      - "Verify key establishment produces correct shared secret"
      - "Test failure modes and error handling"
      - "Performance benchmark under expected load"
    category: "PQC_MIGRATION"
    wave: 1
    timeline_months: 12
    depends_on: []
    strategy_rule: "hybrid-first"
    kb_sources:
      - type: "standard"
        url: "https://csrc.nist.gov/pubs/fips/203/final"
        verified_on: "2026-10-25"
      - type: "rfc"
        url: "https://www.rfc-editor.org/rfc/rfc9954.html"
        verified_on: "2026-10-25"

  - id: "REC-002"
    source_algorithms: ["ECDH", "DH", "X25519", "X448"]
    source_roles: ["key-establishment"]
    target_algorithm: "ML-KEM"
    target_standard: "NIST FIPS 203"
    rationale: "Elliptic-curve and finite-field Diffie-Hellman are vulnerable to Shor's algorithm. ML-KEM provides post-quantum key establishment."
    compatibility_notes:
      - "Different key sizes and performance characteristics"
      - "Protocol integration required"
      - "Consider hybrid ECDH + ML-KEM where supported"
    prerequisites:
      - "Verify protocol supports new key-exchange mechanism"
      - "Check library support for ML-KEM"
    effort_band: "large"
    confidence: "high"
    verification_steps:
      - "Test key agreement with all peer implementations"
      - "Verify forward secrecy properties maintained"
      - "Performance testing"
    category: "PQC_MIGRATION"
    wave: 1
    timeline_months: 12
    depends_on: []
    strategy_rule: "hybrid-first"
    kb_sources:
      - type: "standard"
        url: "https://csrc.nist.gov/pubs/fips/203/final"
        verified_on: "2026-10-25"
      - type: "rfc"
        url: "https://www.rfc-editor.org/rfc/rfc9954.html"
        verified_on: "2026-10-25"

  # Digital Signatures (RSA, ECDSA, EdDSA, DSA)
  - id: "REC-003"
    source_algorithms: ["RSA"]
    source_roles: ["signature"]
    target_algorithm: "ML-DSA or SLH-DSA"
    target_standard: "NIST FIPS 204, FIPS 205"
    rationale: "RSA signatures are vulnerable to Shor's algorithm. ML-DSA and SLH-DSA provide post-quantum signature schemes."
    compatibility_notes:
      - "ML-DSA: faster, smaller signatures; lattice-based"
      - "SLH-DSA: conservative choice; hash-based, larger signatures"
      - "Signature formats completely different"
      - "Verification process changes"
    prerequisites:
      - "Choose between ML-DSA and SLH-DSA based on requirements"
      - "Verify support in target environment"
      - "Update signature verification in all consumers"
    effort_band: "large"
    confidence: "high"
    verification_steps:
      - "Test signature generation and verification"
      - "Verify signature validation in all contexts"
      - "Test with invalid signatures"
      - "Performance and size benchmarks"
    category: "PQC_MIGRATION"
    wave: 2
    timeline_months: 18
    depends_on: []
    strategy_rule: "hybrid-first"
    kb_sources:
      - type: "standard"
        url: "https://csrc.nist.gov/pubs/fips/204/final"
        verified_on: "2026-10-25"
      - type: "standard"
        url: "https://csrc.nist.gov/pubs/fips/205/final"
        verified_on: "2026-10-25"

  - id: "REC-004"
    source_algorithms: ["ECDSA", "EC"]
    source_roles: ["signature"]
    target_algorithm: "ML-DSA or SLH-DSA"
    target_standard: "NIST FIPS 204, FIPS 205"
    rationale: "ECDSA is vulnerable to Shor's algorithm. ML-DSA and SLH-DSA are post-quantum signature alternatives."
    compatibility_notes:
      - "Different signature sizes and performance"
      - "No direct parameter mapping from ECDSA to PQC"
      - "Consider ML-DSA for most cases; SLH-DSA for conservative approach"
    prerequisites:
      - "Library support verification"
      - "Certificate infrastructure updates if used for PKI"
    effort_band: "large"
    confidence: "high"
    verification_steps:
      - "End-to-end signature workflow testing"
      - "Cross-implementation compatibility"
    category: "PQC_MIGRATION"
    wave: 2
    timeline_months: 18
    depends_on: []
    strategy_rule: "hybrid-first"
    kb_sources:
      - type: "standard"
        url: "https://csrc.nist.gov/pubs/fips/204/final"
        verified_on: "2026-10-25"
      - type: "standard"
        url: "https://csrc.nist.gov/pubs/fips/205/final"
        verified_on: "2026-10-25"

  - id: "REC-005"
    source_algorithms: ["Ed25519", "Ed448"]
    source_roles: ["signature"]
    target_algorithm: "ML-DSA or SLH-DSA"
    target_standard: "NIST FIPS 204, FIPS 205"
    rationale: "EdDSA variants are vulnerable to Shor's algorithm despite not using traditional elliptic curves."
    compatibility_notes:
      - "EdDSA's simplicity not directly replicated in PQC signatures"
      - "Performance characteristics will differ"
    prerequisites:
      - "Review usage patterns (Ed25519 often used for its simplicity)"
      - "Evaluate ML-DSA as primary candidate"
    effort_band: "large"
    confidence: "high"
    verification_steps:
      - "Signature and verification testing"
      - "Performance comparison"
    category: "PQC_MIGRATION"
    wave: 2
    timeline_months: 18
    depends_on: []
    strategy_rule: "hybrid-first"
    kb_sources:
      - type: "standard"
        url: "https://csrc.nist.gov/pubs/fips/204/final"
        verified_on: "2026-10-25"
      - type: "standard"
        url: "https://csrc.nist.gov/pubs/fips/205/final"
        verified_on: "2026-10-25"

  - id: "REC-006"
    source_algorithms: ["DSA"]
    source_roles: ["signature"]
    target_algorithm: "ML-DSA or SLH-DSA"
    target_standard: "NIST FIPS 204, FIPS 205"
    rationale: "DSA is vulnerable to Shor's algorithm and also classically deprecated."
    compatibility_notes:
      - "DSA already deprecated classically; migration urgent"
      - "Any PQC signature is an improvement"
    prerequisites:
      - "Identify all DSA usage (should be rare)"
    effort_band: "medium"
    confidence: "high"
    verification_steps:
      - "Full replacement testing"
    category: "PQC_MIGRATION"
    wave: 2
    timeline_months: 12
    depends_on: []
    strategy_rule: "immediate-replace"
    kb_sources:
      - type: "standard"
        url: "https://csrc.nist.gov/pubs/fips/204/final"
        verified_on: "2026-10-25"
      - type: "standard"
        url: "https://csrc.nist.gov/pubs/fips/205/final"
        verified_on: "2026-10-25"

  # Symmetric Encryption - No PQC replacement needed
  - id: "REC-007"
    source_algorithms: ["AES"]
    source_roles: ["symmetric-encryption"]
    target_algorithm: null
    target_standard: null
    rationale: "AES with adequate key size (AES-256) remains quantum-resistant. Grover's algorithm provides quadratic speedup but AES-256 provides sufficient security margin."
    compatibility_notes:
      - "Consider AES-256 if using AES-128"
      - "No post-quantum public-key replacement applicable"
      - "Focus on key-establishment mechanism, not AES itself"
    prerequisites: []
    effort_band: "small"
    confidence: "high"
    action_type: "review"
    verification_steps:
      - "Verify AES key size is 256 bits"
      - "Ensure key establishment uses post-quantum mechanism"
    category: "CLASSICAL_HYGIENE"
    wave: null
    timeline_months: 3
    depends_on: []
    strategy_rule: "review-key-size"
    kb_sources:
      - type: "standard"
        url: "https://csrc.nist.gov/pubs/fips/197/final"
        verified_on: "2026-10-25"

  # Hashing - No PQC replacement for strong hashes
  - id: "REC-008"
    source_algorithms: ["SHA-256", "SHA-384", "SHA-512", "SHA-3"]
    source_roles: ["hash"]
    target_algorithm: null
    target_standard: null
    rationale: "Strong hash functions remain secure against quantum computers. Grover's algorithm provides quadratic speedup, but security margins are sufficient."
    compatibility_notes:
      - "SHA-256 and stronger remain appropriate"
      - "SHA-3 is a conservative choice"
    prerequisites: []
    effort_band: null
    confidence: "high"
    action_type: "no-action-needed"
    verification_steps: []
    category: "CLASSICAL_HYGIENE"
    wave: null
    timeline_months: null
    depends_on: []
    strategy_rule: "review-hash-strength"
    kb_sources:
      - type: "standard"
        url: "https://csrc.nist.gov/pubs/fips/180-4/final"
        verified_on: "2026-10-25"
      - type: "standard"
        url: "https://csrc.nist.gov/pubs/fips/202/final"
        verified_on: "2026-10-25"

  # Classical Weaknesses - Urgent replacement independent of quantum
  - id: "REC-009"
    source_algorithms: ["MD5"]
    source_roles: ["hash"]
    target_algorithm: "SHA-256 or SHA-3"
    target_standard: null
    rationale: "MD5 is classically broken (collision attacks). This is NOT a quantum issue but requires immediate remediation."
    compatibility_notes:
      - "Urgent replacement due to classical weakness"
      - "SHA-256 is widely supported"
      - "SHA-3 provides additional security margin"
    prerequisites: []
    effort_band: "small"
    confidence: "high"
    action_type: "urgent-classical"
    verification_steps:
      - "Replace all MD5 usage"
      - "Verify no legacy MD5 hashes remain in critical paths"
    category: "CLASSICAL_HYGIENE"
    wave: null
    timeline_months: 0
    depends_on: []
    strategy_rule: "immediate-replace"
    kb_sources:
      - type: "standard"
        url: "https://csrc.nist.gov/pubs/fips/180-4/final"
        verified_on: "2026-10-25"
      - type: "rfc"
        url: "https://www.rfc-editor.org/rfc/rfc6151.html"
        verified_on: "2026-10-25"

  - id: "REC-010"
    source_algorithms: ["SHA-1"]
    source_roles: ["hash"]
    target_algorithm: "SHA-256 or SHA-3"
    target_standard: null
    rationale: "SHA-1 is classically broken (collision attacks demonstrated). Urgent replacement needed independent of quantum threats."
    compatibility_notes:
      - "Widely known weakness; migration should be prioritized"
      - "SHA-256 is the standard replacement"
    prerequisites: []
    effort_band: "small"
    confidence: "high"
    action_type: "urgent-classical"
    verification_steps:
      - "Eliminate all SHA-1 usage"
      - "Check certificate chains for SHA-1 signatures"
    category: "CLASSICAL_HYGIENE"
    wave: null
    timeline_months: 0
    depends_on: []
    strategy_rule: "immediate-replace"
    kb_sources:
      - type: "standard"
        url: "https://csrc.nist.gov/pubs/fips/180-4/final"
        verified_on: "2026-10-25"
      - type: "rfc"
        url: "https://www.rfc-editor.org/rfc/rfc6194.html"
        verified_on: "2026-10-25"

  # Unknown or undetermined roles - Manual review required
  - id: "REC-099"
    source_algorithms: ["*"]
    source_roles: ["undetermined"]
    target_algorithm: null
    target_standard: null
    rationale: "Cryptographic role could not be determined from available evidence. Manual review required to understand actual usage before recommending migration."
    compatibility_notes:
      - "Insufficient information for automatic recommendation"
      - "May be library dependency rather than direct usage"
    prerequisites:
      - "Investigate actual cryptographic usage"
