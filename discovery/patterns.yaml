  patterns:
  - name: RSA
    regex: '(RSA\.generate|RSA\.generate_private_key|Cipher\.getInstance\(.?RSA|KeyPairGenerator\.getInstance\(.?RSA)'
    primitive: pke
    variant: "RSA-2048"
  - name: ECDSA
    regex: '(ECDSA|SigningKey\.generate|ec\.generate_private_key)'
    primitive: signature
    variant: "ECDSA"
  - name: ECDH
    regex: '(ECDH|KeyAgreement\.getInstance\(.?ECDH)'
    primitive: key-agree
    variant: "ECDH"
  - name: DH
    regex: '(DiffieHellman|dh\.generate_parameters|KeyAgreement\.getInstance\(.?DH)'
    primitive: key-agree
    variant: "DH"
  - name: AES
    regex: '(AES\.new|Cipher\.getInstance\(.?AES/(?!.*256))'
    primitive: ae
    variant: "AES-128-GCM"
  - name: AES-256
    regex: '(AES\.new.*256|Cipher\.getInstance\(.?AES.*256)'
    primitive: ae
    variant: "AES-256"
  - name: MD5
    regex: '(MD5\.new|hashlib\.md5|MessageDigest\.getInstance\(.?MD5)'
    primitive: hash
    variant: "MD5"
  - name: SHA-1
    regex: '(SHA\.new|hashlib\.sha1|MessageDigest\.getInstance\(.?SHA-?1)'
    primitive: hash
    variant: "SHA-1"
  - name: SHA-256
    regex: '(hashlib\.sha256|MessageDigest\.getInstance\(.?SHA-?256)'
    primitive: hash
    variant: "SHA-256"
  - name: P-256
    regex: '(SECP256R1|secp256r1|P-?256|prime256v1)'
    primitive: signature
    variant: "P-256"
  - name: P-384
    regex: '(SECP384R1|secp384r1|P-?384)'
    primitive: signature
    variant: "P-384"
  - name: secp256k1
    regex: '(secp256k1)'
    primitive: signature
    variant: "secp256k1"
